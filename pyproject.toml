[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-os"
version = "1.1.0"
description = "COMPASS-based pan-cancer overall-survival risk prediction with mechanism-oriented representation readouts (132 gene signatures, 43 concepts)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["pan-cancer", "survival", "COMPASS", "gene-expression", "Cox", "bioinformatics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
]
# 版本按"已验证可复现"的环境固定；上游 COMPASS 已 vendored 于 third_party/，
# 因此这里**不**把 immuno-compass 列为硬依赖（两者只取其一）。
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "scikit-survival>=0.22",
  # 上限必要：vendored 的 compass/utils/crmap.py:447 使用
  # `from matplotlib.cm import get_cmap`，该 API 在 matplotlib 3.7 弃用、**3.9 已移除**。
  # 若不设上限，pip 会装入 3.11.x 并导致 `import compass` 直接 ImportError。
  "matplotlib>=3.7,<3.9",
  # torch 是**核心**运行依赖：冻结 COMPASS 前向传播需要它（representation.py）。
  # README「Requires ... PyTorch」即此意；此前未声明会导致
  # `pip install compass-os` "成功"但 predict() 立即 ModuleNotFoundError。
  "torch>=2.0",
  # seaborn 由 vendored 的 compass/utils/{plotter,crmap}.py 在**模块级**导入，
  # 因此核心路径（get_representation/analyze）也会触发；非可选。
  "seaborn>=0.13",
  # 以下均为 **vendored 上游 compass 包在模块级导入** 的依赖。
  # `import compass` → compass/__init__ → .main → 这些模块，因此
  # import compass_os 后的首次 predict() 就会触发，无法留作可选：
  #   tqdm/wandb/joblib  ← compass/main.py
  #   torchvision        ← compass/encoder/encoder.py (from torchvision.ops import MLP)
  #   einops/packaging   ← compass/encoder/layer/{performer,FlashMultiHead}.py
  #   plotly             ← compass/utils/sankey.py
  #   gdown              ← compass/utils/loader.py
  #   umap-learn         ← compass/utils/plotter.py (import umap)
  # 注：fast_transformers 只在 performer.py 的**函数体内**导入，不在关键路径，故不声明。
  "tqdm>=4.66",
  "wandb>=0.16",
  "joblib>=1.3",
  "torchvision>=0.15",
  "einops>=0.7",
  "packaging>=23.0",
  "plotly>=5.18",
  "gdown>=5.0",
  "umap-learn>=0.5",
  # openpyxl 是 pandas.read_excel 的引擎；vendored 的
  # compass/tokenizer/__init__.py 在**模块级**读取 concept_colors.xlsx，
  # 因此 `import compass` 即需要它（第十个关键路径依赖）。
  "openpyxl>=3.1",
]

[project.optional-dependencies]
upstream = ["immuno-compass==2.5.3"]   # 若不使用 vendored 副本
test = ["pytest>=7"]
# 说明：matplotlib 自 v1.0 起即为**核心依赖**（AnalysisResult.save_report 出图需要）。
# sample_path 的渲染层不引入任何**新增**硬依赖：PNG/PDF/SVG/HTML 全部由同一个
# Matplotlib Figure 导出，HTML 内嵌同一份 PNG 字节 —— 不再需要 Plotly / Kaleido / CDN。
# 该 extra 供 `pip install --no-deps` 等最小安装场景显式补齐绘图依赖使用。
plot = ["matplotlib>=3.7,<3.9"]

[project.urls]
Documentation = "https://github.com/RENSI203/COMPASS-OS#readme"
Source = "https://github.com/RENSI203/COMPASS-OS"
Issues = "https://github.com/RENSI203/COMPASS-OS/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

# assets/ 是**数据目录**而非 Python 包：其中的 vendored COMPASS 必须按 `compass`
# 顶层名导入，因此禁止 setuptools 把 compass_os.assets.* 当作子包发现。
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
exclude = ["compass_os.assets*"]

[tool.setuptools.package-data]
compass_os = [
  "data/*.tsv",
  "data/*.txt",
  # ---- runtime 资产（v1.0.1 起随 wheel 分发）----
  "assets/models/*.json",
  "assets/models/*.npz",
  "assets/models/*.pt",
  "assets/third_party/COMPASS_LICENSE",
  "assets/third_party/compass/**/*.py",
  "assets/third_party/compass/**/*.json",
  "assets/third_party/compass/**/*.csv",
  "assets/third_party/compass/**/*.pt",
  "assets/third_party/compass/**/*.pth",
  "assets/third_party/compass/**/*.txt",
  "assets/third_party/compass/**/*.tsv",
  "assets/third_party/compass/**/*.yaml",
  "assets/third_party/compass/**/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
