[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-os"
version = "1.1.0"
description = "COMPASS-based pan-cancer overall-survival risk prediction with mechanism-oriented representation readouts (132 gene signatures, 43 concepts)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["pan-cancer", "survival", "COMPASS", "gene-expression", "Cox", "bioinformatics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
]
# 版本按"已验证可复现"的环境固定；上游 COMPASS 已 vendored 于 third_party/，
# 因此这里**不**把 immuno-compass 列为硬依赖（两者只取其一）。
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "scikit-survival>=0.22",
  "matplotlib>=3.7",
  # torch 是**核心**运行依赖：冻结 COMPASS 前向传播需要它（representation.py）。
  # README「Requires ... PyTorch」即此意；此前未声明会导致
  # `pip install compass-os` "成功"但 predict() 立即 ModuleNotFoundError。
  "torch>=2.0",
  # seaborn 由 vendored 的 compass/utils/{plotter,crmap}.py 在**模块级**导入，
  # 因此核心路径（get_representation/analyze）也会触发；非可选。
  "seaborn>=0.13",
]

[project.optional-dependencies]
upstream = ["immuno-compass==2.5.3"]   # 若不使用 vendored 副本
test = ["pytest>=7"]
# 说明：matplotlib 自 v1.0 起即为**核心依赖**（AnalysisResult.save_report 出图需要）。
# sample_path 的渲染层不引入任何**新增**硬依赖：PNG/PDF/SVG/HTML 全部由同一个
# Matplotlib Figure 导出，HTML 内嵌同一份 PNG 字节 —— 不再需要 Plotly / Kaleido / CDN。
# 该 extra 供 `pip install --no-deps` 等最小安装场景显式补齐绘图依赖使用。
plot = ["matplotlib>=3.7"]

[project.urls]
Documentation = "https://github.com/RENSI203/COMPASS-OS#readme"
Source = "https://github.com/RENSI203/COMPASS-OS"
Issues = "https://github.com/RENSI203/COMPASS-OS/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

# assets/ 是**数据目录**而非 Python 包：其中的 vendored COMPASS 必须按 `compass`
# 顶层名导入，因此禁止 setuptools 把 compass_os.assets.* 当作子包发现。
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
exclude = ["compass_os.assets*"]

[tool.setuptools.package-data]
compass_os = [
  "data/*.tsv",
  "data/*.txt",
  # ---- runtime 资产（v1.0.1 起随 wheel 分发）----
  "assets/models/*.json",
  "assets/models/*.npz",
  "assets/models/*.pt",
  "assets/third_party/COMPASS_LICENSE",
  "assets/third_party/compass/**/*.py",
  "assets/third_party/compass/**/*.json",
  "assets/third_party/compass/**/*.csv",
  "assets/third_party/compass/**/*.pt",
  "assets/third_party/compass/**/*.pth",
  "assets/third_party/compass/**/*.txt",
  "assets/third_party/compass/**/*.tsv",
  "assets/third_party/compass/**/*.yaml",
  "assets/third_party/compass/**/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
