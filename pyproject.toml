[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-os"
version = "1.0.0"
description = "COMPASS-based pan-cancer overall-survival risk prediction with mechanism-oriented representation readouts (132 gene signatures, 43 concepts)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["pan-cancer", "survival", "COMPASS", "gene-expression", "Cox", "bioinformatics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
]
# 版本按"已验证可复现"的环境固定；上游 COMPASS 已 vendored 于 third_party/，
# 因此这里**不**把 immuno-compass 列为硬依赖（两者只取其一）。
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scikit-survival>=0.22",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
upstream = ["immuno-compass==2.5.3"]   # 若不使用 vendored 副本
test = ["pytest>=7"]

[project.urls]
Documentation = "https://github.com/RENSI203/COMPASS-OS#readme"
Source = "https://github.com/RENSI203/COMPASS-OS"
Issues = "https://github.com/RENSI203/COMPASS-OS/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compass_os = ["data/*.tsv", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
